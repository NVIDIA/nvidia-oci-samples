name: Bug Report
description: Report a problem with an existing sample
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much information as you can.
        **Do not include security vulnerabilities here.** Follow the process in [SECURITY.md](../SECURITY.md) instead.
  - type: input
    id: sample
    attributes:
      label: Affected sample
      description: Which sample directory is affected? (e.g., `agentic/oke/aiq/aiq-2.0`)
      placeholder: agentic/oke/aiq/aiq-2.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug, including any error output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OCI region, shape (e.g., `VM.GPU.A10.1`), OKE/K8s version, NVIDIA driver/operator versions, CUDA version, etc.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: false
